<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定投计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f6f7;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
    color: #18181b;
  }
  .card {
    background: #fff;
    border: 1px solid #ebebee;
    border-radius: 24px;
    padding: 36px 32px;
    width: 100%;
    max-width: 460px;
    height: fit-content;
  }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: .02em; margin-bottom: 24px; }
  #list { display: flex; flex-direction: column; }
  .amount {
    width: 100%;
    font-size: 26px;
    font-weight: 600;
    padding: 14px 18px;
    background: #f4f4f5;
    border: 2px solid transparent;
    border-radius: 16px;
    outline: none;
    margin-bottom: 28px;
    transition: background .15s, border-color .15s;
  }
  .amount:focus { background: #fff; border-color: #18181b; }
  .row {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    align-items: center;
    gap: 10px 12px;
    padding: 12px 0;
    border-bottom: 1px solid #f4f4f5;
  }
  .dot { width: 10px; height: 10px; border-radius: 4px; }
  .name { font-size: 15px; color: #3f3f46; }
  .pct { font-size: 13px; color: #a1a1aa; font-weight: 400; }
  .pchip {
    display: inline-flex;
    align-items: center;
    margin-left: 2px;
    padding: 2px 8px;
    background: #f4f4f5;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    color: #71717a;
    cursor: text;
    transition: background .15s, box-shadow .15s;
  }
  .pchip:focus-within { background: #fff; box-shadow: inset 0 0 0 1.5px #18181b; }
  .pctin {
    font: inherit;
    color: #18181b;
    text-align: right;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    width: 2ch;
  }
  .pctin::-webkit-outer-spin-button, .pctin::-webkit-inner-spin-button { -webkit-appearance: none; }
  .quote {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
    color: #a1a1aa;
    margin: -12px 0 20px;
  }
  .quote a { cursor: pointer; white-space: nowrap; }
  .quote a:hover { color: #18181b; }
  .dev { display: inline-block; font-size: 11.5px; color: #a1a1aa; margin-left: 4px; white-space: nowrap; }
  .dev.hot { color: #e5484d; }
  .dev.cold { color: #10a267; }
  .penote { grid-column: 1 / -1; font-size: 11.5px; color: #a1a1aa; }
  .penote:empty { display: none; }
  .penote.hot { color: #e5484d; font-weight: 600; }
  .penote.cold { color: #10a267; }
  .sumline { margin-top: 10px; font-size: 12.5px; color: #a1a1aa; text-align: right; }
  .sumline.bad { color: #e5484d; font-weight: 500; }
  .val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar {
    grid-column: 1 / -1;
    height: 4px;
    border-radius: 2px;
    background: #f4f4f5;
    overflow: hidden;
  }
  .bar i { display: block; height: 100%; border-radius: 2px; }
  .stats {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 4px 10px;
    font-size: 12.5px;
    color: #a1a1aa;
    font-variant-numeric: tabular-nums;
  }
  .warn { color: #e5484d; font-weight: 600; }
  .stats input {
    width: 84px;
    font: inherit;
    color: #3f3f46;
    text-align: right;
    padding: 4px 8px;
    background: #f4f4f5;
    border: 1px solid transparent;
    border-radius: 8px;
    outline: none;
    transition: background .15s, border-color .15s;
  }
  .stats input:focus { background: #fff; border-color: #18181b; }
  .stats[hidden] { display: none; }
  .gain { color: #10a267; }
  .loss { color: #e5484d; }
  .rec-btn {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #18181b;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s;
  }
  .rec-btn:hover { background: #3f3f46; }
  .rec-btn:disabled { background: #d4d4d8; cursor: not-allowed; }
  .total { margin: 28px 0 8px; padding-top: 14px; border-top: 1px solid #ebebee; }
  .trow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 4px 0;
    font-size: 14px;
    color: #71717a;
  }
  .trow b { font-size: 18px; color: #18181b; font-variant-numeric: tabular-nums; }
  .trow #cost { font-size: 22px; }
  .hist-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 6px;
    font-size: 13px;
    color: #a1a1aa;
    cursor: pointer;
    user-select: none;
  }
  .hist-head i {
    font-style: normal;
    transition: transform .2s;
  }
  .hist-head.open i { transform: rotate(180deg); }
  #hist, #rv {
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease;
  }
  #hist.open { max-height: 200px; overflow-y: auto; }
  #rv.open { max-height: 260px; }
  #hist::-webkit-scrollbar { width: 4px; }
  #hist::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 2px; }
  .hrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    font-size: 13px;
    color: #a1a1aa;
    border-bottom: 1px solid #f7f7f8;
  }
  .hrow b { color: #71717a; font-weight: 500; font-variant-numeric: tabular-nums; margin-left: auto; }
  .hrow a { color: #d4d4d8; cursor: pointer; font-size: 16px; padding: 0 4px; }
  .hrow a:hover { color: #e5484d; }
  .io { display: flex; justify-content: center; gap: 24px; margin-top: 20px; font-size: 13px; color: #a1a1aa; }
  .io a { cursor: pointer; }
  .io a:hover { color: #18181b; }
  .sellbtn {
    font-size: 11.5px;
    color: #a1a1aa;
    border: 1px solid #e4e4e7;
    border-radius: 6px;
    padding: 1px 6px;
    cursor: pointer;
    margin-left: 4px;
  }
  .sellbtn:hover { color: #18181b; border-color: #18181b; }
  .sellbox[hidden] { display: none; }
  .sellbox a { cursor: pointer; padding: 0 4px; color: #a1a1aa; }
  .sellbox a:hover { color: #18181b; }
  .hrow .selltag { color: #d97706; font-weight: 600; }
  .hrow .sellsub { font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>定投分配计算器</h1>
  <div class="quote" id="quote"></div>
  <input class="amount" id="amount" type="number" min="0" placeholder="输入定投总金额" autofocus>
  <div id="list"></div>
  <div class="sumline" id="sumline"></div>
  <button class="rec-btn" id="rec" disabled>记录本次定投</button>
  <div class="total">
    <div class="trow"><span>总成本 <span class="pct" id="count"></span></span><b id="cost">¥ 0</b></div>
    <div class="trow" id="mrow" hidden><span>总市值</span><b id="mkt"></b></div>
    <div class="trow" id="prow" hidden><span>持仓收益</span><b id="pnl"></b></div>
    <div class="trow" id="rrow" hidden><span>已实现收益</span><b id="rpnl"></b></div>
  </div>
  <div class="hist-head" id="histHead" hidden><span id="histLabel">历史记录</span><i>▾</i></div>
  <div id="hist"></div>
  <div class="hist-head" id="rvHead" hidden><span>复盘 · 动态比例 vs 固定基准</span><i>▾</i></div>
  <div id="rv"></div>
  <div class="io"><a id="exp">⬇ 导出 JSON</a><a id="imp">⬆ 导入 JSON</a></div>
  <input type="file" id="file" accept=".json" hidden>
</div>
<script>
  // base: 基准比例；mode: fix=固定份额(吃残差) / pe=按手填PE分位估值定投 / ma=按200日均线偏离调节
  // src: [接口, 代码]；step: 每偏离多少调 1 个百分点（仅 ma 用）
  const assets = [
    { name: "S&P 500",    base: 35, color: "#7086f0", src: ["tx", "us.INX"],   mode: "fix" },
    { name: "A500",       base: 25, color: "#e8705f", src: ["tx", "sh000510"], mode: "pe" },
    { name: "BTC",        base: 25, color: "#eda14f", src: ["bn", "BTCUSDT"],  mode: "ma", step: 0.10 },
    { name: "黄金",        base: 15, color: "#d9b84a", src: ["tx", "sh518880"], mode: "ma", step: 0.05 },
  ];
  const fmt = n => "¥ " + n.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  let pcts = {};
  try { pcts = JSON.parse(localStorage.dcaPct) || {}; } catch {}
  // 清掉已下架资产的残留键（历史记录 recs 保持原样不动）
  const prune = o => { for (const k in o) if (!assets.some(a => a.name === k)) delete o[k]; };
  prune(pcts);
  assets.forEach(a => { if (!(a.name in pcts)) pcts[a.name] = a.base; });
  // A500 的 PE 历史分位（手填，估值 App 查询；建议用沪深300 近10年分位代理）
  let peSt = null; // {v: 0-100, t: 填写时间戳}
  try { peSt = JSON.parse(localStorage.dcaPe); } catch {}
  if (!peSt || !isFinite(peSt.v)) peSt = null;
  const sumPct = () => assets.reduce((s, a) => s + pcts[a.name], 0);
  const pnlHtml = (d, base) =>
    `<b class="${d >= 0 ? "gain" : "loss"}">${d >= 0 ? "+" : "-"}${fmt(Math.abs(d))} (${d >= 0 ? "+" : "-"}${Math.abs(d / base * 100).toFixed(1)}%)</b>`;

  document.getElementById("list").innerHTML = assets.map((a, i) => `
    <div class="row">
      <span class="dot" style="background:${a.color}"></span>
      <span class="name">${a.name} <span class="pchip"><input class="pctin" id="pc${i}" type="number" min="0" max="100" step="1" value="${pcts[a.name]}">%</span>${a.mode === "pe" ? ` <span class="pchip" title="PE 历史分位，估值 App 查询后填入">PE<input class="pctin" id="pe" type="number" min="0" max="100" step="1" value="${peSt ? peSt.v : ""}">%</span>` : ""} <span class="dev" id="d${i}"></span></span>
      <span class="val" id="v${i}">—</span>
      <div class="bar"><i id="b${i}" style="background:${a.color}"></i></div>${a.mode === "pe" ? `
      <div class="penote" id="penote"></div>` : ""}
      <div class="stats" id="st${i}" hidden>
        <span>成本 <span id="c${i}"></span></span>
        <span>市值 <input id="m${i}" type="number" min="0" placeholder="未填"><a class="sellbtn" id="sb${i}" title="记录卖出">卖</a></span>
        <span class="sellbox" id="sx${i}" hidden>卖出 <input id="sv${i}" type="number" min="0" placeholder="金额"><a id="sc${i}" title="确认">✓</a><a id="sq${i}" title="取消">×</a></span>
        <span id="rz${i}"></span>
        <span id="w${i}"></span>
        <span id="p${i}"></span>
      </div>
    </div>`).join("");

  const input = document.getElementById("amount"), recBtn = document.getElementById("rec");
  function updateCalc() {
    const total = parseFloat(input.value), sum = sumPct(), ok = sum === 100;
    recBtn.disabled = !(total > 0) || !ok;
    assets.forEach((a, i) => {
      document.getElementById("v" + i).textContent = total > 0 && ok && pcts[a.name] > 0 ? fmt(total * pcts[a.name] / 100) : "—";
      document.getElementById("b" + i).style.width = Math.min(pcts[a.name] * 4, 100) + "%";
    });
    const sl = document.getElementById("sumline");
    sl.textContent = ok ? "比例合计 100%" : `比例合计 ${sum}% · 需为 100%`;
    sl.className = "sumline" + (ok ? "" : " bad");
  }
  input.addEventListener("input", updateCalc);

  const fitPct = el => el.style.width = Math.max(el.value.length, 1) + "ch";
  const syncPctInputs = () => assets.forEach((a, i) => {
    const el = document.getElementById("pc" + i);
    el.value = pcts[a.name];
    fitPct(el);
  });
  assets.forEach((a, i) => {
    const el = document.getElementById("pc" + i);
    fitPct(el);
    el.addEventListener("input", () => {
      pcts[a.name] = Math.max(0, Math.min(100, Math.round(parseFloat(el.value) || 0)));
      fitPct(el);
      updateCalc();
      render();
    });
    el.addEventListener("change", () => { el.value = pcts[a.name]; fitPct(el); });
  });

  // PE 分位输入：本地持久化；行情已加载时立即重算建议比例
  const peEl = document.getElementById("pe");
  if (peEl) {
    fitPct(peEl);
    peEl.addEventListener("input", () => {
      const v = parseFloat(peEl.value);
      peSt = isFinite(v) ? { v: Math.max(0, Math.min(100, v)), t: Date.now() } : null;
      try { peSt ? localStorage.dcaPe = JSON.stringify(peSt) : localStorage.removeItem("dcaPe"); } catch {}
      fitPct(peEl);
      if (sugg) { sugg = suggest(); pcts = { ...sugg }; syncPctInputs(); }
      renderDevs();
      updateCalc();
      render();
    });
    peEl.addEventListener("change", () => { peEl.value = peSt ? peSt.v : ""; fitPct(peEl); });
  }

  let recs = [], mv = {};
  try { recs = JSON.parse(localStorage.dca) || []; } catch {}
  try { mv = JSON.parse(localStorage.dcaMv) || {}; } catch {}
  prune(mv);

  // 按时间顺序重放全部记录：买入累加成本，卖出按「成本/卖出前市值」比例结转成本
  // 返回按资产名的 成本/已实现收益/累计结转成本 map，及供历史列表逐行展示的 sellInfo
  function replay() {
    const cost = {}, realized = {}, relieved = {}, sellInfo = new Map();
    const order = [...recs.keys()].sort((a, b) => recs[a].t - recs[b].t);
    for (const i of order) {
      const r = recs[i];
      if (r.type === "sell") {
        const c = cost[r.name] || 0, preMv = r.m?.[r.name];
        const ratio = preMv > 0 ? c / preMv : 1; // 快照缺失退化为按成本结转
        const rel = Math.min(r.v * ratio, c);    // 结转不超过剩余成本
        cost[r.name] = Math.max(c - rel, 0);
        realized[r.name] = (realized[r.name] || 0) + (r.v - rel);
        relieved[r.name] = (relieved[r.name] || 0) + rel;
        sellInfo.set(i, { relieved: rel, gain: r.v - rel });
      } else {
        const p = r.p || pcts;
        const split = r.s || Object.fromEntries(assets.map(a => [a.name, r.v * (p[a.name] || 0) / 100]));
        for (const k in split) cost[k] = (cost[k] || 0) + split[k];
      }
    }
    return { cost, realized, relieved, sellInfo };
  }

  function render() {
    try {
      localStorage.dca = JSON.stringify(recs);
      localStorage.dcaMv = JSON.stringify(mv);
      localStorage.dcaPct = JSON.stringify(pcts);
    } catch {}
    const { cost: sums, realized, relieved, sellInfo } = replay();
    let totMv = 0, totPnl = 0, hasMv = false;
    assets.forEach((a, i) => {
      const cost = sums[a.name] || 0, m = mv[a.name];
      document.getElementById("st" + i).hidden = !cost;
      if (!cost) return;
      document.getElementById("c" + i).textContent = fmt(cost);
      const inp = document.getElementById("m" + i);
      if (document.activeElement !== inp) inp.value = m ?? "";
      const rz = realized[a.name];
      document.getElementById("rz" + i).innerHTML =
        rz ? `已实现 <span class="${rz >= 0 ? "gain" : "loss"}">${rz >= 0 ? "+" : "-"}${fmt(Math.abs(rz))}</span>` : "";
      document.getElementById("p" + i).innerHTML = m > 0 ? pnlHtml(m - cost, cost) : "";
      if (m > 0) { totMv += m; totPnl += m - cost; hasMv = true; }
    });
    // 持仓占比 vs 基准目标（目标按已填市值的资产归一化），偏离≥5个点标红
    const mvBaseSum = assets.reduce((s, a) => s + (mv[a.name] > 0 ? a.base : 0), 0);
    assets.forEach((a, i) => {
      const m = mv[a.name], el = document.getElementById("w" + i);
      if (!(m > 0) || !totMv || !mvBaseSum) { el.textContent = ""; return; }
      const share = m / totMv * 100, target = a.base / mvBaseSum * 100;
      // 停投资产只展示占比，不设目标、不告警
      el.textContent = a.base ? `占 ${share.toFixed(0)}% · 目标 ${target.toFixed(0)}%` : `占 ${share.toFixed(0)}%`;
      el.className = a.base && Math.abs(share - target) >= 5 ? "warn" : "";
    });
    const rows = document.querySelectorAll("#list .row");
    assets.map((a, i) => {
      const cost = sums[a.name] || 0, m = mv[a.name];
      return { i, y: m > 0 && cost > 0 ? (m - cost) / cost : -Infinity };
    }).sort((a, b) => b.y - a.y || a.i - b.i)
      .forEach((r, pos) => rows[r.i].style.order = pos);
    document.getElementById("cost").textContent = fmt(Object.values(sums).reduce((s, x) => s + x, 0));
    // 定投节奏：距上次天数，超过历史中位间隔的1.5倍标红（只算买入，卖出不重置节奏）
    const countEl = document.getElementById("count");
    const buys = recs.filter(r => r.type !== "sell");
    if (buys.length) {
      const times = buys.map(r => r.t).sort((a, b) => a - b);
      const days = Math.floor((Date.now() - times[times.length - 1]) / 864e5);
      const gaps = times.slice(1).map((t, i) => (t - times[i]) / 864e5).filter(g => g >= 1).sort((a, b) => a - b);
      const med = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 30;
      const late = days > Math.max(med * 1.5, 7);
      countEl.innerHTML = `共 ${buys.length} 次 · <span class="${late ? "warn" : ""}">距上次 ${days} 天</span>`;
    } else countEl.textContent = "暂无记录";
    document.getElementById("mrow").hidden = document.getElementById("prow").hidden = !hasMv;
    if (hasMv) {
      document.getElementById("mkt").textContent = fmt(totMv);
      document.getElementById("pnl").innerHTML = pnlHtml(totPnl, totMv - totPnl);
    }
    const totRz = Object.values(realized).reduce((s, x) => s + x, 0);
    const totRel = Object.values(relieved).reduce((s, x) => s + x, 0);
    document.getElementById("rrow").hidden = !sellInfo.size;
    if (sellInfo.size) document.getElementById("rpnl").innerHTML = totRel > 0
      ? pnlHtml(totRz, totRel)
      : `<b class="${totRz >= 0 ? "gain" : "loss"}">${totRz >= 0 ? "+" : "-"}${fmt(Math.abs(totRz))}</b>`;
    document.getElementById("histHead").hidden = !recs.length;
    document.getElementById("rvHead").hidden = !recs.length;
    document.getElementById("histLabel").textContent = `历史记录 · ${recs.length} 条`;
    document.getElementById("hist").innerHTML = recs.map((r, i) => {
      const title = new Date(r.t).toLocaleString("zh-CN", { dateStyle: "short", timeStyle: "short" });
      if (r.type === "sell") {
        const s = sellInfo.get(i), g = s.gain;
        const pct = s.relieved > 0 ? ` (${g >= 0 ? "+" : "-"}${Math.abs(g / s.relieved * 100).toFixed(1)}%)` : "";
        return `
      <div class="hrow" title="${title}">
        <span>${new Date(r.t).toLocaleDateString("zh-CN")} <span class="selltag">卖出</span> ${r.name}</span>
        <span class="sellsub">结转 ${fmt(s.relieved)} · <span class="${g >= 0 ? "gain" : "loss"}">${g >= 0 ? "+" : "-"}${fmt(Math.abs(g))}${pct}</span></span>
        <b>${fmt(r.v)}</b><a onclick="del(${i})" title="删除">×</a>
      </div>`;
      }
      return `
      <div class="hrow" title="${title}">
        <span>${new Date(r.t).toLocaleDateString("zh-CN")}</span>
        <b>${fmt(r.v)}</b><a onclick="del(${i})" title="删除">×</a>
      </div>`;
    }).reverse().join("");
  }
  function del(i) { recs.splice(i, 1); render(); }

  document.getElementById("histHead").addEventListener("click", e => {
    e.currentTarget.classList.toggle("open");
    document.getElementById("hist").classList.toggle("open");
  });
  document.getElementById("rvHead").addEventListener("click", e => {
    renderReview();
    e.currentTarget.classList.toggle("open");
    document.getElementById("rv").classList.toggle("open");
  });

  assets.forEach((a, i) => {
    document.getElementById("m" + i).addEventListener("input", e => {
      const v = parseFloat(e.target.value);
      if (v > 0) mv[a.name] = v; else delete mv[a.name];
      render();
    });
  });

  // ── 卖出：行内展开金额输入，确认后记一笔 sell 并自动扣减该资产市值 ──
  function toggleSell(i, show) {
    document.getElementById("sx" + i).hidden = !show;
    document.getElementById("sb" + i).style.display = show ? "none" : "";
    const sv = document.getElementById("sv" + i);
    sv.value = "";
    if (show) sv.focus();
  }
  function confirmSell(a, i) {
    const v = parseFloat(document.getElementById("sv" + i).value), preMv = mv[a.name];
    if (!(v > 0)) return;
    if (!(preMv > 0)) { alert("请先填写该资产当前市值再记录卖出"); toggleSell(i, false); return; }
    if (v > preMv) { alert(`卖出金额不能超过当前市值 ${fmt(preMv)}`); return; }
    recs.push({
      t: Date.now(), type: "sell", name: a.name, v,
      m: { ...mv },
      d: Object.fromEntries(assets.filter(x => devs[x.name] != null).map(x => [x.name, +(devs[x.name] * 100).toFixed(1)])),
      pe: peSt?.v,
    });
    const rem = preMv - v;
    if (rem > 0) mv[a.name] = rem; else delete mv[a.name];
    toggleSell(i, false);
    render();
  }
  assets.forEach((a, i) => {
    document.getElementById("sb" + i).onclick = () => {
      if (!(mv[a.name] > 0)) { alert("请先填写该资产当前市值再记录卖出"); return; }
      toggleSell(i, true);
    };
    document.getElementById("sq" + i).onclick = () => toggleSell(i, false);
    document.getElementById("sc" + i).onclick = () => confirmSell(a, i);
    document.getElementById("sv" + i).addEventListener("keydown", e => {
      if (e.key === "Enter") confirmSell(a, i);
      if (e.key === "Escape") toggleSell(i, false);
    });
  });

  recBtn.addEventListener("click", () => {
    const v = parseFloat(input.value);
    recs.push({
      t: Date.now(), v,
      p: { ...pcts },
      s: Object.fromEntries(assets.map(a => [a.name, v * pcts[a.name] / 100])),
      m: { ...mv },
      d: Object.fromEntries(assets.filter(a => devs[a.name] != null).map(a => [a.name, +(devs[a.name] * 100).toFixed(1)])),
      pe: peSt?.v,
    });
    render();
  });

  // ── 行情与三模型比例：BTC/黄金看200日均线偏离，A500 看手填 PE 分位，标普吃剩余份额 ──
  const BASES = assets.map(a => a.base).join("/");
  let devs = {}, sugg = null, klines = {};

  async function fetchCloses(a) {
    const [api, code] = a.src, signal = AbortSignal.timeout(10000);
    let rows, ci, dateOf;
    if (api === "bn") {
      rows = await (await fetch(`https://api.binance.com/api/v3/klines?symbol=${code}&interval=1d&limit=220`, { signal })).json();
      ci = 4;
      dateOf = r => new Date(r[0]).toISOString().slice(0, 10);
    } else {
      const d = (await (await fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${code},day,,,320,qfq`, { signal })).json()).data[code];
      rows = d.day || d.qfqday;
      ci = 2;
      dateOf = r => r[0];
    }
    const raw = rows.map(r => [dateOf(r), parseFloat(r[ci])]).filter(p => isFinite(p[1]) && p[1] > 0);
    // 盘中最后一根K线偶见错乱数据：与上一保留值跳变超35%的行丢弃
    const seed = raw.slice(0, 10).map(p => p[1]).sort((x, y) => x - y);
    let prev = seed[Math.floor(seed.length / 2)];
    const pairs = [];
    for (const p of raw) {
      if (Math.abs(p[1] / prev - 1) > 0.35) continue;
      pairs.push(p);
      prev = p[1];
    }
    if (pairs.length < 200) throw new Error(code);
    return pairs;
  }

  // 某资产在时间 t（本地日期）当天或之前最近一个交易日的收盘价
  function priceAt(name, t) {
    const k = klines[name];
    if (!k) return null;
    const d = new Date(t);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    for (let i = k.length - 1; i >= 0; i--) if (k[i][0] <= key) return k[i][1];
    return null;
  }

  // 复盘：每笔记录按当时指数点位折算到现在，动态分配 vs 固定基准各值多少钱
  function renderReview() {
    const el = document.getElementById("rv");
    const missing = assets.filter(a => !klines[a.name]).map(a => a.name);
    if (missing.length) {
      el.innerHTML = `<div class="hrow">复盘需要全部资产行情（缺 ${missing.join("、")}）</div>`;
      return;
    }
    let dyn = 0, fix = 0, used = 0, skipped = 0;
    for (const r of recs) {
      if (r.type === "sell") continue; // 复盘只对比买入策略
      const p = r.p || pcts;
      const split = r.s || Object.fromEntries(assets.map(a => [a.name, r.v * (p[a.name] || 0) / 100]));
      if (assets.some(a => !(priceAt(a.name, r.t) > 0))) { skipped++; continue; }
      used++;
      // 老记录可能含已下架资产的份额：两边都只按现存资产的实投金额对比，口径一致
      const vEff = assets.reduce((s, a) => s + (split[a.name] || 0), 0);
      for (const a of assets) {
        const k = klines[a.name], ratio = k[k.length - 1][1] / priceAt(a.name, r.t);
        dyn += (split[a.name] || 0) * ratio;
        fix += vEff * a.base / 100 * ratio;
      }
    }
    const diff = dyn - fix;
    el.innerHTML = used ? `
      <div class="hrow"><span>动态比例买入现值</span><b>${fmt(dyn)}</b></div>
      <div class="hrow"><span>固定基准买入现值</span><b>${fmt(fix)}</b></div>
      <div class="hrow"><span>动态 − 固定</span>${pnlHtml(diff, fix)}</div>
      <div class="hrow"><span>计入 ${used} 笔买入${skipped ? ` · ${skipped} 笔超出行情范围未计` : ""}${recs.some(r => r.type === "sell") ? " · 卖出不参与对比" : ""} · 按指数近似，不含费率/汇率</span></div>`
      : `<div class="hrow">记录都超出行情数据范围（约近一年内可复盘）</div>`;
  }

  function suggest() {
    // A500：PE 分位 >70 停投（份额按基准比例让给其余），<30 提到 40 个点（其余等比压缩），未填按基准
    const peA = assets.find(a => a.mode === "pe" && a.base);
    const pe = peA && peSt ? peSt.v : null;
    let aShare = peA ? peA.base : 0;
    if (pe != null && pe > 70) aShare = 0;
    else if (pe != null && pe < 30) aShare = 40;
    const others = assets.filter(a => a.base && a !== peA);
    const obSum = others.reduce((s, a) => s + a.base, 0);
    const scale = obSum ? (100 - aShare) / obSum : 0; // 其余资产的有效基准 = base × scale
    // BTC/黄金在有效基准上做均线偏离加减；标普不看自身均线，吃剩余份额（吸收 BTC/黄金 的加减）
    const prelim = {};
    let maSum = 0, fixSum = 0;
    others.forEach(a => {
      const e = a.base * scale;
      if (a.mode !== "ma") { fixSum += e; return; }
      const d = devs[a.name];
      let tilt = 0;
      if (d != null) {
        const r = -d / a.step;
        tilt = Math.sign(r) * Math.min(3, Math.round(Math.abs(r)));
      }
      maSum += prelim[a.name] = Math.max(e + tilt, 1);
    });
    const rest = 100 - aShare - maSum;
    const exact = assets.map(a => {
      if (!a.base) return 0; // 停投资产不参与
      if (a === peA) return aShare;
      if (a.mode === "ma") return fixSum ? prelim[a.name] : prelim[a.name] * (100 - aShare) / maSum;
      return rest * a.base * scale / fixSum;
    });
    // 最大余数法取整到合计恰为 100
    const out = exact.map(Math.floor);
    const left = 100 - out.reduce((s, x) => s + x, 0);
    exact.map((x, i) => ({ i, f: x - out[i] }))
      .sort((p, q) => q.f - p.f || assets[q.i].base - assets[p.i].base)
      .slice(0, left)
      .forEach(p => out[p.i]++);
    return Object.fromEntries(assets.map((a, i) => [a.name, out[i]]));
  }

  // A500 的估值状态行
  function renderPeNote() {
    const note = document.getElementById("penote"), a = assets.find(x => x.mode === "pe");
    if (!note) return;
    if (!peSt) {
      note.className = "penote";
      note.textContent = "请填写 PE 历史分位（建议用沪深300 近10年分位代理，韭圈儿/雪球可查），未填按基准定投";
      return;
    }
    const dt = new Date(peSt.t), days = Math.floor((Date.now() - peSt.t) / 864e5);
    const when = `${dt.getMonth() + 1}-${String(dt.getDate()).padStart(2, "0")} 填写${days > 30 ? ` · 已 ${days} 天建议更新` : ""}`;
    const chg = sugg && a && sugg[a.name] !== a.base ? ` · ${a.base}→${sugg[a.name]}` : "";
    if (peSt.v > 70) { note.className = "penote hot"; note.textContent = `⚠ PE 分位 ${peSt.v}% 高估：本期停买，建议分批卖出换入其他资产${chg} · ${when}`; }
    else if (peSt.v < 30) { note.className = "penote cold"; note.textContent = `PE 分位 ${peSt.v}% 低估：加投至 40%${chg} · ${when}`; }
    else { note.className = "penote"; note.textContent = `PE 分位 ${peSt.v}% 正常区间，按基准定投${chg} · ${when}`; }
  }

  function renderDevs() {
    renderPeNote();
    assets.forEach((a, i) => {
      const el = document.getElementById("d" + i), d = devs[a.name];
      if (a.mode === "pe") { el.textContent = ""; el.className = "dev"; return; } // A500 状态见 penote
      if (d == null) {
        el.className = "dev";
        el.textContent = a.name in devs ? "行情未获取" : "";
      } else {
        const abs = Math.abs(d * 100), v = abs.toFixed(abs >= 10 ? 0 : 1);
        const zero = parseFloat(v) === 0;
        el.className = "dev " + (zero ? "" : d >= 0 ? "hot" : "cold");
        const chg = sugg && sugg[a.name] !== a.base ? ` · ${a.base}→${sugg[a.name]}` : "";
        el.textContent = `距200日线 ${zero ? "0%" : (d >= 0 ? "+" : "-") + v + "%"}${chg}`;
      }
    });
  }

  async function refreshQuotes() {
    const q = document.getElementById("quote");
    q.textContent = "获取行情中…";
    const res = await Promise.allSettled(assets.map(fetchCloses));
    devs = {};
    let ok = 0;
    res.forEach((r, i) => {
      const a = assets[i];
      if (r.status === "fulfilled") {
        klines[a.name] = r.value;
        const closes = r.value.map(p => p[1]), ma = closes.slice(-200).reduce((s, x) => s + x, 0) / 200;
        devs[a.name] = closes[closes.length - 1] / ma - 1;
        ok++;
      } else devs[a.name] = null;
    });
    let msg;
    if (ok) {
      sugg = suggest();
      pcts = { ...sugg };
      syncPctInputs();
      msg = ok === assets.length ? `已按行情调整 · 基准 ${BASES}` : `已按行情调整（${assets.length - ok} 项行情未获取，按基准）`;
    } else {
      sugg = null;
      msg = "行情获取失败，沿用当前比例";
    }
    q.innerHTML = `<span>${msg}</span><a id="qr" title="重新获取行情">↻ 刷新</a>`;
    document.getElementById("qr").onclick = refreshQuotes;
    renderDevs();
    updateCalc();
    render();
    if (document.getElementById("rv").classList.contains("open")) renderReview();
  }

  const file = document.getElementById("file");
  document.getElementById("exp").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(recs, null, 2)], { type: "application/json" }));
    a.download = `定投记录-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById("imp").addEventListener("click", () => file.click());
  file.addEventListener("change", () => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(fr.result);
        if (!Array.isArray(data) || data.some(r => typeof r.t !== "number" || typeof r.v !== "number")) throw 0;
        if (!recs.length || confirm(`导入将覆盖当前 ${recs.length} 条记录，继续？`)) {
          recs = data;
          const last = recs[recs.length - 1];
          if (last && last.m) {
            mv = { ...last.m };
            if (last.type === "sell") { // 卖出记录的 m 是卖出前快照，扣掉卖出金额
              const rem = (mv[last.name] || 0) - last.v;
              if (rem > 0) mv[last.name] = rem; else delete mv[last.name];
            }
            prune(mv);
          }
          const lastP = [...recs].reverse().find(r => r.p); // 卖出记录无 p，回退到最近一条买入
          if (lastP) {
            pcts = { ...pcts, ...lastP.p };
            prune(pcts);
            syncPctInputs();
          }
          updateCalc();
          render();
        }
      } catch { alert("文件格式不对，需要本工具导出的 JSON"); }
      file.value = "";
    };
    fr.readAsText(file.files[0]);
  });
  updateCalc();
  render();
  refreshQuotes();
</script>
</body>
</html>
