<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>投资账本</title>
  <link rel="stylesheet" href="styles.css">
  <script src="ledger.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<main class="app">
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">账</span><div><h1>投资账本</h1><p>每一笔投资，每一分现金。</p></div></div>
    <span class="local-badge"><i></i> 本地保存</span>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <section class="overview" aria-label="资产概览">
    <div class="overview-head"><span>我的资产</span><span>总资产 <b id="total-assets">¥ 0.00</b></span></div>
    <div class="metrics">
      <div class="metric"><span>净投入</span><strong id="invested">¥ 0.00</strong><small id="capital-detail">转入 0 · 取出 0</small></div>
      <div class="metric"><span>持仓市值</span><strong id="market-value">¥ 0.00</strong><small id="market-status">暂无持仓</small></div>
      <div class="metric cash-metric"><span>可用现金</span><strong id="cash">¥ 0.00</strong><small>卖出及未分配的资金留在这里</small></div>
      <div class="metric"><span>总盈亏 <em id="profit-badge" class="tag" hidden>估算</em></span><strong id="profit">¥ 0.00</strong><small id="profit-status">市值 + 现金 − 净投入</small></div>
    </div>
  </section>
  <section class="section holdings" aria-labelledby="holdings-title">
    <div class="section-head"><h2 id="holdings-title">资产持仓</h2><span class="muted">占比包含现金</span></div>
    <div id="holdings"></div>
    <div class="plan-line"><div><span id="plan-summary"></span><span id="pe-summary"></span></div><button id="open-settings" class="text-button" type="button">设置</button></div>
  </section>
  <nav class="actions" aria-label="记账操作">
    <button id="open-buy" class="primary" type="button">＋ 记买入</button>
    <button id="open-sell" type="button">记卖出</button>
    <button id="open-valuation" type="button">更新市值</button>
    <button id="open-cash" type="button">更多资金</button>
  </nav>
  <section id="editor" class="section editor" aria-labelledby="editor-title" hidden>
    <div class="section-head"><h2 id="editor-title"></h2><button id="close-editor" class="icon-button" type="button" aria-label="关闭录入面板">×</button></div>
    <form id="entry-form" novalidate>
      <div id="form-fields"></div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="form-actions"><button id="save-entry" class="primary" type="submit">保存</button><button id="save-settings" type="button" hidden>仅保存比例与 PE</button></div>
    </form>
  </section>
  <section class="section history" aria-labelledby="history-title">
    <div class="section-head"><h2 id="history-title">历史流水 <span id="history-count" class="muted"></span></h2><button id="undo-delete" class="text-button" type="button" hidden>撤销删除</button></div>
    <div id="history"></div>
    <button id="load-more" class="load-more" type="button" hidden>查看更多记录</button>
  </section>
  <footer>
    <div class="backup-actions"><button id="export" type="button">导出完整备份</button><button id="import" type="button">导入备份</button><button id="recover" type="button" hidden>恢复导入前数据</button></div>
    <p>数据保存在当前浏览器，请定期导出备份。所有金额均为人民币。</p>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
  </footer>
</main>
</body>
</html>
